name: Store IAP

# Creates the in-app products from tools/products.csv in App Store Connect (tools/create_iap.py --only asc)
# with the release workflows' ASC API key. apply=false lists the app versions and what would be created.
on:
  workflow_dispatch:
    inputs:
      products:
        description: product ids, space separated
        required: true
        default: gamebook_archion gamebook_gulasspagety
      apply:
        description: create them (false = dry run)
        type: boolean
        default: false

jobs:
  asc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASC key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, json, os
          json.dump({"key_id": os.environ["KEY_ID"], "issuer_id": os.environ["ISSUER_ID"],
                     "key": base64.b64decode(os.environ["KEY_B64"]).decode()}, open(os.path.join(os.environ["RUNNER_TEMP"], "asc.json"), "w"))
          PY
      - name: Create products
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc.json
        run: python3 tools/create_iap.py ${{ inputs.products }} --only asc ${{ inputs.apply && '--apply' || '' }}
