name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Fetch starter pack
        # assets/packs/starter.zip is gitignored (93 MB artifact of `webtoon export-pack`);
        # it ships as an asset of the starter-v1 GitHub release. Local difference from Distribution.
        env:
          GH_TOKEN: ${{ github.token }}
        # Without the release (not published yet) the build gets an empty placeholder pack, which PackStore ignores.
        run: |
          gh release download starter-v1 -R ${{ github.repository }} -p starter.zip -D app/assets/packs --clobber \
            || python3 -c "import zipfile,json; zipfile.ZipFile('app/assets/packs/starter.zip','w').writestr('pack.json', json.dumps({'schema':1,'id':'starter','title':'Starter','version':0,'worlds':[],'stories':[],'episodes':[]}))"

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

  build-android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Fetch starter pack
        # assets/packs/starter.zip is gitignored (93 MB artifact of `webtoon export-pack`);
        # it ships as an asset of the starter-v1 GitHub release. Local difference from Distribution.
        env:
          GH_TOKEN: ${{ github.token }}
        # Without the release (not published yet) the build gets an empty placeholder pack, which PackStore ignores.
        run: |
          gh release download starter-v1 -R ${{ github.repository }} -p starter.zip -D app/assets/packs --clobber \
            || python3 -c "import zipfile,json; zipfile.ZipFile('app/assets/packs/starter.zip','w').writestr('pack.json', json.dumps({'schema':1,'id':'starter','title':'Starter','version':0,'worlds':[],'stories':[],'episodes':[]}))"

      - name: Build APK (debug)
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios-debug:
    name: iOS Debug Build (Simulator)
    runs-on: macos-15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Fetch starter pack
        # assets/packs/starter.zip is gitignored (93 MB artifact of `webtoon export-pack`);
        # it ships as an asset of the starter-v1 GitHub release. Local difference from Distribution.
        env:
          GH_TOKEN: ${{ github.token }}
        # Without the release (not published yet) the build gets an empty placeholder pack, which PackStore ignores.
        run: |
          gh release download starter-v1 -R ${{ github.repository }} -p starter.zip -D app/assets/packs --clobber \
            || python3 -c "import zipfile,json; zipfile.ZipFile('app/assets/packs/starter.zip','w').writestr('pack.json', json.dumps({'schema':1,'id':'starter','title':'Starter','version':0,'worlds':[],'stories':[],'episodes':[]}))"

      - name: Build iOS (no signing)
        working-directory: app
        run: flutter build ios --debug --no-codesign

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-${{ github.sha }}
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 7
