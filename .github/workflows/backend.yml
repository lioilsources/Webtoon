name: Backend

# Go backend gate: gofmt, vet, tests. The Postgres service is a throwaway CI database, so the
# store and integration tests (WEBTOON_TEST_DATABASE_URL) run here too; they never touch JODA.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: ['**']
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  test:
    name: Go vet & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: ffmpeg (voice worker encode test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        env:
          WEBTOON_TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
        run: go test ./...
