# From Distribution/workflows (golden) via align-project.sh. Local differences:
# release builds pass --dart-define=WEBTOON_API from the repository variable
# WEBTOON_API (the app/lib/config.dart default is localhost), the Flutter
# version is not pinned to 3.41 (app needs Dart ^3.12), and on Android a
# missing keystore secret fails the run and Firebase runs only once
# FIREBASE_ANDROID_APP_ID is set.

name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    env:
      # A release talks to the deployed backend, not the localhost default
      # in app/lib/config.dart. Repository variable, not a secret: it ships
      # inside the app anyway.
      WEBTOON_API: ${{ vars.WEBTOON_API }}
      # Secrets can't be read in a step's `if`; a job env can.
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check WEBTOON_API
        run: |
          [ -n "$WEBTOON_API" ] || { echo "::error::Repository variable WEBTOON_API is not set (gh variable set WEBTOON_API --body https://…)"; exit 1; }
          echo "API: $WEBTOON_API"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Bump build number
        working-directory: app
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          NEW="${BASE}+${{ github.run_number }}"
          sed -i -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          echo "Build version: ${NEW}"

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set — run Distribution/scripts/setup-gh-secrets.sh"; exit 1; }
          echo -n "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > app/android/app/release.keystore
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties

      - name: Build release AAB
        working-directory: app
        run: flutter build appbundle --release --dart-define=WEBTOON_API=$WEBTOON_API

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --dart-define=WEBTOON_API=$WEBTOON_API

      - name: Verify APK signing certificate
        run: |
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK signing certificate ==="
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -20

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          name: Webtoon ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true

      - name: Upload to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: Alfa
          releaseNotes: "Webtoon ${{ github.ref_name }} (build ${{ github.run_number }})"
          file: app/build/app/outputs/flutter-apk/app-release.apk
