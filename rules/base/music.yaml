# Music library rules of m0/music.py (AiStack audio service, ACE-Step, container audio-music) for shorts.py.
# On demand: the model is used whenever AiStack reports it available (it fits next to the running profile); one job
# at a time, never start the container yourself; if it is not available, ask Director to bring it up.

length: 80   # s: ACE-Step returns 9–19 % short of this; the longest short is ~65 s, and shorts.py loops anyway
model: acestep-v15-turbo
prompt_suffix: ", instrumental, no vocals"
seed_base: 4200   # track k gets seed_base + k: a rerun redraws the same track

# One track per mood; shorts.py --music data/music picks one per world (stable hash), so a series keeps its sound.
moods:
  lofi_1: lo-fi hip hop, warm rhodes piano, soft vinyl crackle, mellow drums, romantic, evening city
  lofi_2: chill lo-fi beat, jazzy guitar, gentle bass, rainy cafe, tender
  piano_1: solo piano, emotional, slow, romantic ballad, intimate
  piano_2: piano and strings, hopeful, cinematic, gentle build
  acoustic_1: acoustic guitar, fingerpicking, sunny, light percussion, summer romance
  acoustic_2: ukulele and acoustic guitar, playful, cute, light claps
  synth_1: dreamy synthpop, soft pads, slow tempo, night drive, neon, longing
  synth_2: chillwave, warm analog synths, nostalgic, sunset
  latin_1: bossa nova, nylon guitar, soft brushes, warm, seaside evening
  latin_2: romantic latin guitar, light percussion, havana night, sensual but soft
  strings_1: string quartet, bittersweet, slow, melancholic romance
  strings_2: orchestral strings, swelling, happy ending, emotional
  rnb_1: smooth r&b instrumental, soft keys, slow groove, late night
  world_1: afrobeat instrumental, soft kalimba, warm groove, joyful
  world_2: indian sitar and soft tabla, romantic, gentle, modern chill

# One track per gamebook: its trailer (webtoon trailer) and its full short (tools/gulas_shorts.py --music auto) share it.
# → data/music/trailers/<gamebook id>.mp3, outside the moods pool above, so shorts.py --music data/music never picks
# a book's own track for another world. An existing file is kept (louka, kovovenebe, mlceni came from webtoon music).
# seed: fixed per book (these were moods 15–20 before, seed_base + k), so a rerun redraws the same track.
gamebooks:
  # Kulový blesk guláš: one sound per LLM that wrote the gamebook
  gulasspagety: {seed: 4215, prompt: "driving trance, metallic percussion, industrial clangs, deep space ambience, cosmic noise, pulsing synths"}   # grok
  gulasknedlik: {seed: 4216, prompt: "smoky jazz club, tenor saxophone lead, upright bass, brushed drums, piano comping"}   # le chat
  poslednislovo: {seed: 4217, prompt: "slow electric blues, bending guitar, harmonica, shuffle drums, walking bass"}   # chatgpt
  poslednislovopavilon: {seed: 4218, prompt: "traditional chinese music, guzheng and erhu, bamboo flute, pentatonic, cinematic"}   # deepseek
  knedlikvzakopu: {seed: 4219, prompt: "baroque organ fugue in the style of bach, pipe organ, cathedral reverb, majestic counterpoint"}   # kimi
  uknedliku: {seed: 4220, prompt: "upbeat country, banjo picking, fiddle, acoustic guitar, stomping rhythm"}   # claude
  # other gamebooks: their own track for the trailer and the TikTok video
  archion: {seed: 4221, prompt: "minimal techno, hypnotic four-on-the-floor kick, dry clicks, deep sub bass, sparse modular synth stabs, cold and repetitive"}   # gemini
