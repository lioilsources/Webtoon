# Default -type of export-pack: the world's profile (data/stories/<id>/world.json `profile`, else rules.world_profile
# from audience), mapped here. Superhero worlds need world.json `profile: superhero` (audience alone says kids).
type_from_profile: {kids: kids, harlequin: harlequin, superhero: superhero}
type_from_audience: {kids: kids, adult: harlequin}

# Bundles: one product unlocks every pack of the covered types, the current ones AND any added later (the app
# resolves it from the catalog at runtime, so a new pack needs no new bundle product). `all` = every type.
bundles:
  - id: bundle_kids
    product_id: bundle_kids
    price_tier: bundle_type
    covers: {types: [kids]}
    title_i18n: {cs: Vše pro děti, en: All Kids stories, de: Alles für Kinder, it: Tutto per bambini, fr: Tout pour enfants,
                 pl: Wszystko dla dzieci, pt-BR: Tudo infantil, ja: キッズ全部, ko: 어린이 전체, vi: Trọn bộ thiếu nhi,
                 ru: Всё для детей, uk: Усе для дітей}
