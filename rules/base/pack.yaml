# Content pack rules of backend/internal/pack (`webtoon export-pack`, PACK_FORMAT.md), read with gopkg.in/yaml.v3.
# The backend finds this file at $WEBTOON_RULES/base/pack.yaml, else rules/base/pack.yaml in the working directory or
# a parent. A profile's `profile.pack` (audience label, exported) documents its packs; the Go side needs only this file.

part_size: 25      # stories per zip; a bigger pack is split into parts a, b, c… (store download sizes)
webp_quality: 85   # cwebp -q for panels (PNG → WebP, same size) and covers
cover: {width: 416, height: 608}   # story cover: p00 of the first episode, centre-cropped to this aspect
# Free strips (local_strip.sh -f, ids lxf_) are never published, whatever the selection says; shorts.py reads it too.
forbidden_world_prefix: w_lxf_
# Episode API fields the pack drops: server state the offline reader has no use for.
dropped_episode_fields: [error, created_at, updated_at]

# ---- Store and catalog (PACK_FORMAT.md, catalog schema 2) --------------------------------------------------------
# The app is free with a bundled starter; the stores sell only unlocks (non-consumable IAP). The content itself is
# hosted outside the stores: catalog.json + covers on GitHub Pages, zips on GitHub Releases. The app composes a zip
# URL from base_urls, so moving the zips (e.g. to Cloudflare R2) is a catalog change, not an app release.
catalog_schema: 2
base_urls:
  pages: https://lioilsources.github.io/webtoon-content/
  releases: https://github.com/lioilsources/webtoon-content/releases/download/
  r2: null          # set to "https://cdn…/" and the app downloads zips from there instead of releases
repo: lioilsources/webtoon-content   # `gh release create … --repo` (export-pack prints the command, never runs it)

pack_size: 50       # stories per paid pack (0.99 USD); 2 zips of part_size each
max_previews: 6     # story covers per pack shown as the store's cover grid

# Names, filled with {type} {n} {version} {part}. Products and tags are permanent once created in the stores /
# on GitHub, so the scheme must not change; a new pack version is a new release tag, the product stays.
naming:
  pack_id: "{type}-{n}"
  product_id: "pack_{type}_{n}"
  release_tag: "pack-{type}-{n}-v{version}"
  asset: "{type}-{n}-{part}.zip"
  gamebook_product: "gamebook_{id}"   # gamebook alone
  kit_product: "kit_{id}"             # gamebook + editor kit (STUB: the gamebook reader is a later phase)

# Price hints for docs/store-products.md and tools/products.csv; the app shows the store's localized price.
# Apple now uses price points; `tier` is the equivalent of the old price tier (USD 0.99 = Tier 1).
price_tiers:
  pack:        {usd: 0.99, tier: 1}
  gamebook:    {usd: 1.99, tier: 2}
  bundle_type: {usd: 2.99, tier: 3}
  kit:         {usd: 3.99, tier: 4}
  bundle_all:  {usd: 6.99, tier: 7}

# Pack types. Only `active` types go into catalog.json `types`; the others are reserved so ids, icons and names are
