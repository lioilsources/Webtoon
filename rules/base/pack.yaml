    product_id: bundle_harlequin
    price_tier: bundle_type
    covers: {types: [harlequin]}
    title_i18n: {cs: Všechna romantika, en: All Romance stories, de: Alle Romantik, it: Tutto romantico, fr: Toute la romance,
                 pl: Cały romans, pt-BR: Todo o romance, ja: ロマンス全部, ko: 로맨스 전체, vi: Trọn bộ lãng mạn,
                 ru: Вся романтика, uk: Уся романтика}
  - id: bundle_superhero
    product_id: bundle_superhero
    price_tier: bundle_type
    covers: {types: [superhero]}
    title_i18n: {cs: Všichni superhrdinové, en: All Superhero stories, de: Alle Superhelden, it: Tutti i supereroi,
                 fr: Tous les super-héros, pl: Wszyscy superbohaterowie, pt-BR: Todos os super-heróis, ja: ヒーロー全部,
