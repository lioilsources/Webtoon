# Timing and layout rules of m0/shorts.py (backend episode → 9:16 video for TikTok / YouTube Shorts).
# Free strips are never published: the world prefix is rules/base/pack.yaml forbidden_world_prefix (shared with the packs).

frame: {width: 1080, height: 1920, fps: 30}
top: 200          # TikTok/Shorts top bar: no lettering above this
bottom: 380       # caption and buttons: no lettering in the bottom 380 px
fade: 0.35        # crossfade between panels, seconds
font_scale: 2.2   # compose.py letters for an 800 px strip; a phone frame wants them bigger

# Each panel stays up as long as its text takes to read: clamp(base + per_char × characters of its bubbles, min, max).
panel_duration: {base: 1.8, per_char: 0.07, min: 2.5, max: 6.0}
loop: {min_duration: 4.0, fps: 16}   # at least two passes of a 2 s loop; Wan loops are 16 fps
zoom: {portrait: 0.08, landscape: 0.05}   # slow zoom over a panel's duration (portrait fills the frame)

cards:
  title: {duration: 1.8, size: 96}
  end: {duration: 2.0, size: 120}

# End card text by episode language; any other language gets `default`.
end:
  default: The End
  texts: {cs: Konec, en: The End, de: Ende, fr: Fin, it: Fine, pl: Koniec, pt-BR: Fim, ru: Конец, uk: Кінець, ja: おわり,
          ko: 끝, vi: Hết}

# --subtitles: the bubbles' text as subtitles above the bottom bar instead of bubbles in the picture.
subtitles: {size: 30, margin: 40, box_alpha: 150, colors: {speech: [255, 255, 255], narration: [255, 222, 130], machine: [150, 225, 255]}}

# --dub: every bubble spoken by the TTS service (AiStack audio, Spark); first matching speaker_id prefix wins,
# "*" = everyone else (machines, narration). engine: xtts | chatterbox | piper | kokoro (Spark) or say (macOS).
# fx = ffmpeg audio filter on the line. Licences: xtts output is non-commercial (Coqui CPML),
# piper jirka is unclear, piper kasandra needs the attribution "Hlas Kasandra © Ondřej Šimek, CC BY 4.0".
dub:
  url: http://192.168.88.66:8093
  lead: 0.25     # s from the panel's start to its first line
  gap: 0.3       # s between lines
  tail: 0.5      # s after the last line
  asr_accept: 0.92   # Whisper similarity at which a take is good enough (no more takes)
  asr_margin: 0.12   # s kept after Whisper's end of the last word (it ends words a little early)
  music_duck: 0.35   # music volume under a dubbed video (gulas_shorts --music auto ducks it further while someone speaks)
  voices:
    # takes: XTTS garbles line ends or babbles on, so up to this many takes are checked by Whisper (WEBTOON_ASR_PYTHON
    # = an interpreter with mlx-whisper) and the best is cut after its last word; without Whisper, tail_rate (s per
    # character, a slow estimate) is the fallback: the first pause after that much speech ends the line
    - {match: olin, engine: xtts, voice: "custom:ol1n-mikes", takes: 8, tail_rate: 0.07}
    - {match: jana, engine: piper, voice: "piper:cs_CZ-kasandra-medium"}
    - match: "*"
      engine: piper
      voice: "piper:cs_CZ-jirka-medium"
      fx: "asetrate=48000*0.8,aresample=48000,atempo=1.25,afftfilt=real='hypot(re,im)*sin(0)':imag='hypot(re,im)*cos(0)':win_size=512:overlap=0.75,aecho=0.8:0.5:20:0.25,volume=1.5"
  mute: ["U KN DLÍKU 2089"]   # neon sign with a dead letter: shown, never read out
