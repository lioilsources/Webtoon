# Loop rules of m0/animate.py (Wan 2.2 I2V 14B, start = end = the panel still → a seamless 1–3 s loop).
# How many panels may loop per story is rules/base/storyboard.yaml limits.max_animated (adapt checks it, animate obeys it).

fps: 16   # Wan's native rate; length must be 4n+1 (VAE compresses time 4:1) → 17 / 33 / 49 frames for 1 / 2 / 3 s

# Video is rendered at ~0.34 Mpx and upscaled in the strip; HD costs 5x (video-stack phase3 bench).
size: {portrait: [480, 704], landscape: [704, 480]}

# Negative prompt: artefacts Wan Lightning tends to produce, then the SFW tail of an app loop (the free profile
# swaps the tail for its age part: free lifts the SFW fence, never the adults-only one).
negative:
  common: [blurry, static, low quality, watermark, text, letters, extra limbs, extra fingers, morphing, deformed,
           distorted face, flicker, jitter, camera shake]
  tail: [nsfw, nude, cleavage, underwear]

style_tail_tags: 4   # the preset's first aesthetic tags appended to the motion prompt, so the loop keeps the look
default_motion: subtle ambient motion, static camera   # --panels given for a panel without a motion prompt
webp_quality: 80
