# Content pack rules of backend/internal/pack (`webtoon export-pack`, PACK_FORMAT.md), read with gopkg.in/yaml.v3.
# The backend finds this file at $WEBTOON_RULES/pack.yaml, else rules/pack.yaml in the working directory or a parent.

part_size: 25      # stories per zip; a bigger pack is split into parts a, b, c… (store download sizes)
webp_quality: 85   # cwebp -q for panels (PNG → WebP, same size) and covers
cover: {width: 416, height: 608}   # story cover: p00 of the first episode, centre-cropped to this aspect
# Free strips (local_strip.sh -f, ids lxf_) are never published, whatever the selection says; shorts.py reads it too.
forbidden_world_prefix: w_lxf_
# Episode API fields the pack drops: server state the offline reader has no use for.
dropped_episode_fields: [error, created_at, updated_at]
