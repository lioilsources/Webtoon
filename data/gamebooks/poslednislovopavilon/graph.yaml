premise: >
  Restaurace „NEON GULÁŠ & PASTA“, tady venkovní, v čínském zahradním pavilonu, a prší. Olin u guláše s knedlíkem
  a piva, Jana u špaget s parmazánem a bílého vína, servisní dron s doporučeními. Olin se rozhodl, že se hádat
  nebude. Jana chce mít poslední slovo.

