# Gamebook — Poslední slovo (pavilon). Kulový blesk, verze „DeepSeek“: stejná dvojice, jiný text od autora (Olin,
# 2026-11-08, „POSLEDNÍ SLOVO, divadelní hra pro Toonfork“), text replik je doslova jeho. Název s přívlastkem
# „(pavilon)“, protože „Poslední slovo“ už nese verze „ChatGPT“ (obdoba „Kulový blesk (tuš)“).
# Styl podle obecné představy o modelu: jednodušší, rychlý, „8B kvantizace“, přemýšlivý. Preset botticelli_pavilon
# (Botticelliho tempera, retro, květiny a motýli) má schválně jen 16 kroků; tváře mají místy pózy přemýšlení
# (ruka u brady, pohled vzhůru), bez jakéhokoli textu navíc. Prostředí autor přesunul do venkovní čínské restaurace
# v zahradním pavilonu: scénické poznámky v `see` jsou doslova (déšť na skle, neon, reklamy), kreslí se ale pavilon,
# déšť ze střechy a lampiony místo neonu.
# Lineární: pět uzlů, žádné volby. Scénické poznámky se kreslí (tagy), nepíšou se do bublin; poznámka, ve které jsou
# Olin i Jana, je rozdělená na dva obrazy (sourozenci nikdy spolu v obraze). Toonfork poznámka na konci hry je režijní
# a nekreslí se. Uzly 2–5 začínají úvodním obrazem bez textu (pravidlo: první panel uzlu je establishing bez
# postav); jeho `see` je v závorce, protože to není poznámka autora. Překlepy v replikách: žádné.
#
# Kreslí se z `script` (m0/gamebook.py draft): `say` = replika ve vlastním panelu mluvčího, `see` = scénická poznámka
# jako obraz. Profil comedy (jídlo a pití v obraze smějí být).

