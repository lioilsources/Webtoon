# Gamebook — Archion: Zahrada uprostřed hluku. Verze „ChatGPT“: samostatná linka hry o Kosmovi a Ol1novi, scénář
# Ol1n nosí brýle (od autora, 2026-11-14): thin-framed glasses ve všech jeho postavách.
# napsal model ChatGPT (od Ol1na). Život v režimu přerušení 2016–2023, pak zahrada 2024–2025 a závěrečný monolog.
# Lineární, sedm uzlů g1–g7, bez voleb.
# Smyšlená verze: druhá strana je smyšlená postava Kosmo a jeho hra Nebulon (Dreamer → Kosmo, Orbitron → Nebulon,
# „Dreamer Lucky is online“ → „Kosmo je online“). Bez skutečných jmen: Marcela → Partnerka, Avast → „firma“ (zmínka
# vypuštěna, zbylo „po čtyřech letech“). Kosmovy repliky jsou ChatGPT vymyšlené, ne citace ze skutečného chatu. Roky
# 2016–2023 zůstávají jako titulky kapitol (Ol1nův vlastní život). Vypuštěné: vložené popisky obrázků z vyhledávání
# („laid off after promotion…“, „Жилинспекция…“, „Aluguel de Marteletes…“, „Práce z chalupy…“ aj.) a režijní klíč.
# Hlasy bez těla (Partnerka za dveřmi, Kolega a Nadřízený z reproduktoru notebooku, Kosmovy zprávy, HLAS OL1Na,
# projekce BUILD FAILED / CONNECTION LOST) jsou titulky (`caption`). Monolog: vzpomínky jako titulky nad prázdnými
# místy minulých let, zbytek Ol1novy bubliny. Otázka z režijní poznámky („Když já jsem ti pomáhal stavět tvůj svět…“)
# je Ol1nův poslední titulek před „Tak pojďme na to.“ a BUILD STARTED. Dvě vzpomínky (2016, 2018) v monologu sloučené
# do jedné bubliny. „Dítě 1/2/3“ v rekonstrukci = jeden titulek „Tati! Tati! Tatiiiii!“ (děti mimo obraz).
# Postavy podle autora (2026-11-14): Ol1n je blond s plnovousem a vypadá mladší, než je (2016: 36, vypadá na konec
# dvacítky; 2020–2023: vyhublý, zarostlý, propadlé oči — pozvolný rozpad osobnosti, ChatGPTova linka je přesně tohle
# období; zahrada 2024: zdravý, klidný, návrat k životu). Odloučení od dětí se do dialogu nepíše, nese ho jen obraz:
# Ol1n se v Mezihře vrací do zahrady. Kosmo blond, rozcuchaný, vlněný svetr, v jeho pokoji tarot, papyrus, ankh,
# figurka mimozemšťana, knihy o archeologii, plakát pyramidy.
#
# Styl: archion_charcoal — uhel a grafit, reportážní skicy na šedém papíře; barvu nesou jen lokace zahrady (první
# dotek akvarelu), byty a kanceláře jsou šedé. Prostředí: malý byt s postýlkou, open space pod zářivkami, home office
# s hračkami, dvě postýlky, byt v rekonstrukci (plachty, prach, sbíječka), pak zahrada.
# Hudba (L40S, ACE-Step, rules/base/music.yaml `gamebooks:` na větvi fix/gamebook-music):
#   archion_chatgpt: "glitchy lo-fi, stuttering broken beat, tape stops, interrupted melancholic electric piano, baby monitor static"

