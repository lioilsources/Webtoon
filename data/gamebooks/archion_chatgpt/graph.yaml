  Sedm let, kdy se Ol1novi rozpadá jedna jistota za druhou: dítě, výpovědi, covid, dvojčata, rok rekonstrukce za
  provozu. Programuje v každé mezeře mezi pláčem, porady a sbíječkou a pomáhá kamarádovi Kosmovi stavět jeho svět.
  Až na zahradě poprvé najde ticho a spustí vlastní build.

