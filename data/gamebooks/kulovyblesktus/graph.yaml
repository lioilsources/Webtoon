# Tušová verze (noir_ink_brush, SDXL base + Chinese Ink LoRA) téhož příběhu jako data/gamebooks/kulovyblesk.
# Gamebook 5 — Kulový blesk v neonovém zákopu. Jednoaktovka (od autora, Olin); text replik je doslova jeho.
# Sourozenci Olin a Jana: dvě roviny, které se míjejí (tvorba jako řemeslo × nástroj na efektivitu). Není to temné:
# ironie, klid, a v posledním obraze světlo, ve kterém prosvítá naděje, že si jednou porozumí. Teď ještě ne.
# Lineární: jeden uzel, žádné volby, žádný nový text. Poslední slovo má Jana (replika doplněná autorem 2026-11-07).
# Opravené překlepy: „Rychce“ → „Rychle“ ve scénické poznámce (poznámky se kreslí, nepíšou), „jsi to toho“ → „jsi do
# toho“ v Janině poslední replice.
#
# Kreslí se z `script` (m0/gamebook.py draft): `say` = replika ve vlastním panelu mluvčího (sourozenci nikdy spolu
# v obraze), `see` = scénická poznámka jako obraz. Styl noir_ink: černobílá čínská tuš, filmové noir světlo,
# realistické proporce (ne manga), neony jen jako bílé světlo. Oba nosí brýle.

