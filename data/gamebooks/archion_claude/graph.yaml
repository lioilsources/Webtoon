# Gamebook — Archion: Hra o čtyřech ročních obdobích. Verze „Claude“: stejný spor jako Archion, scénář napsal model Claude
# (od Ol1na). Prolog (dvě noci útočiště v krytu) a čtyři dějství podle ročních období, lineární, bez voleb.
# Smyšlená verze: druhá strana sporu je smyšlená postava Kosmo a jeho hra Nebulon (soubor pravidel NebulonTactics.md).
# Kosmovy repliky, které odpovídají skutečným zprávám, jsou přepsané vlastními slovy, nejsou citace; Kosmovy repliky,
# které si model vymyslel, zůstaly. Ol1novy repliky jsou doslova, jen bez částek a dat („šedesát tisíc“ → „peníze“,
# „třicet / třicet / třicet“ → „první část / druhou / zbytek“). Bez emoji.
#
# Prostředí: skutečný protiatomový kryt z dob studené války (ocelové dveře, beton, neony, stohy grafických karet,
# kabely jako kořeny), kde se nemění čas, a rodinná zahrada, kde běží čtyři roční období (bílá třešeň a tulipány;
# růže, slunečnice, nafukovací bazének; rezavá hromada listí; sníh a sněhulák). Plátno s chatem je jen v titulcích.
# Motivy: věnec z pampelišek na klávesnici → sněhová koule na zavřeném notebooku; smazaná zpráva „Půl na půl…“
# odeslaná až v zimě („Zpráva nebyla doručena.“); při každém „dlužíš“ zhasne v krytu neon.
# Styl: archion_linocut (linoryt): hra je o jevišti a ročních obdobích, tisk ze dvou tří barev nese teplé barvy zahrady
# a studenou tyrkysovou krytu z tag_prompt lokací.
# Hudba (pro L40S, ACE-Step, položka `gamebooks:` v rules/base/music.yaml na větvi fix/gamebook-music):
#   archion_claude: "baroque chamber strings, vivaldi four seasons slowed down, harpsichord, melancholic, intimate"
#
# Kreslí se z `script` (m0/gamebook.py draft): `say` = replika ve vlastním panelu mluvčího, `see` = scénická poznámka
# jako obraz, `caption` = zpráva na plátně nebo hlas bez těla. Kosmo a Ol1n nikdy v jednom obraze, ani v prologu.
# Postavy (autor, 2026-11-14): Ol1n 46, vypadá pod 40, blond, plnovous; v prologu (konec rozpadu 2018–2023) pohublý,
# zarostlý, s prázdným pohledem, v dějstvích 2026 zdravý, klidný, vřelý. Kosmo 44, vypadá pod 40, rozcuchané trčící
# blond vlasy, obnošený vlněný svetr, o vzhled nedbá. V krytu jeho zájmy jako rekvizity (tarot, egyptský papyrus a ankh,
# figurka mimozemšťana, knihy o archeologii, mapy, plakát pyramidy); v němé akci vykládá tarot, nové repliky o tom ne.
# Pětileté jsou dvojčata: Pětiletá první (růžová) a Pětiletá druhá (modrá), spolu jako dvojcata_5.

