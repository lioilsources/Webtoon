  Kosmo deset let staví hru Nebulon v protiatomovém krytu, kde nikdy není den ani noc. Ol1n, otec tří dcer, pracuje
  na zahradě, kde se střídají roční období. Kdysi u něj Ol1n hledal útočiště. Teď si píšou přes plátno a rok se nachýlí.

