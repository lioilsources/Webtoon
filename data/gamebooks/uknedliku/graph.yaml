# Gamebook — U Knedlíku 2089. Kulový blesk, verze „Claude“: stejná dvojice, jiný text od autora (Olin, 2026-11-08),
# Číšník je vždy vidět (Olin, 2026-11-14): robotická, biomechanická či mimozemská bytost s robotickým hlasem, ve world bez „no humans“; jeho panely vrácené ze scénáře (8. 11. je nahradily výhledy), hlášky reproduktoru říká on. Každý uzel má po úvodním panelu zklidňující výhled l_vyhled s monumentem podle prostředí (Atomium, Titanic, Velká čínská zeď, Saturn, Parthenón, Eiffelovka). Úpravy jsou přímo ve storyboard.json a gb_*/world.json, gamebook.py draft by je přepsal.
# krátká komorní hra o třech scénách; text replik je doslova jeho. Hra nemá vlastní název, název je jméno restaurace.
# Styl podle obecné představy o modelu: intelektuální, odměřený. Prostředí autor přesunul do univerzitní menzy jako na
# Stanfordu v šedesátých letech: pin-up ilustrace staré Ameriky, za okny staré bouráky (preset pinup_60s). Neonový
# nápis, holografické plakáty a AI zpravodajství ze scénických poznámek se kreslí do té menzy (nápis nad výdejem).
# Lineární: tři uzly, žádné volby, žádný nový text. Scénické poznámky v závorkách se kreslí (tagy), nepíšou se.
# Nápisy, které hra ukazuje na scéně („U KN DLÍKU 2089“, „NECH TO NA NÁS“, „U KN DLÍKU“, „U K EDLÍKU“,
# „U KNEDLÍKU 2089“), jsou `caption` (písmo vypravěče), nekreslí se do obrazu.
# „OLIN a JANA (současně): Já.“ jsou dva rychlé panely za sebou, Olin „Já.“ a Jana „Já.“ (sourozenci nikdy spolu
# v obraze). Překlepy v replikách nejsou; hovorové tvary („skvělý“, „chtěj“, „tvýho“, „jiný hry“) zůstávají, ve
# scénických poznámkách zůstává i „šířej“ a zkratka „Hol. plakát“.
#
# Kreslí se z `script` (m0/gamebook.py draft): `say` = replika ve vlastním panelu mluvčího, `see` = scénická poznámka
# jako obraz (dlouhé poznámky rozdělené na panely doslova, po větách). Profil comedy (jídlo a pití v obraze smějí být).

