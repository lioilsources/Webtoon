premise: >
  Univerzitní menza v roce 2089, jako ze šedesátých let. U jediného osvětleného stolu Olin s gulášem, knedlíkem
  a pivem a jeho sestra Jana, překladatelka, se špagetami a bílým vínem. Hádka, která se nikdy nestane.

characters: [olin_40, jana_37, robotcisnik]

locations:
