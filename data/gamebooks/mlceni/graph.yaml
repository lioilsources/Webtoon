      - První stránka je prázdná.
      - Psycholog zavře knihu.
      - Z vedlejší místnosti se ozve tlumený zvuk hodin.
      - "Psycholog: (tiše, pro sebe) Kolik lidí musí nejprve zmizet samo sobě, aby mohli uvěřit, že mají právo existovat?"
      - Zhasne se.
