id: gulasspagety
title: Guláš a špagety
title_i18n: {de: "Gulasch und Spaghetti", en: "Goulash and Spaghetti", fr: "Goulash et spaghetti", it: "Gulasch e spaghetti", ja: "グヤーシュとスパゲッティ", ko: "굴라시와 스파게티", pl: "Gulasz i spaghetti", pt-BR: "Gulache e espaguete", ru: "Гуляш и спагетти", uk: "Гуляш і спагеті", vi: "Goulash và spaghetti"}
world: w_gulas_spagety
