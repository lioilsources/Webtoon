# Gamebook 7 — Guláš a špagety (Toonfork – scéna). Kulový blesk, verze „Grok“: stejná dvojice, jiný text od autora
# (Olin, 2026-11-08), text replik je doslova jeho. Styl podle obecné představy o modelu: drzý, puberťácký, sytě
# neonový (preset neon_brat, karikatura s tlustými obrysy). Postavy jsou dospělé (kolem padesátky), „nezletilý“ je
# tón kreslení, ne věk. Prostředí autor přesunul do restaurace v raketě na cestě na Měsíc (matné sklo, chrom,
# neonové trubice barvy staré mědi, za oknem Měsíc).
# Lineární: jeden uzel, žádné volby. Scénické poznámky v závorkách se kreslí (tagy), nepíšou se do bublin.
# Opravený překlep ve scénické poznámce: „nahnne“ → „nahne“.
#
# Kreslí se z `script` (m0/gamebook.py draft): `say` = replika ve vlastním panelu mluvčího (sourozenci nikdy spolu
# v obraze), `see` = scénická poznámka jako obraz. Profil comedy (jídlo a pití v obraze smějí být, karikatura je záměr).

