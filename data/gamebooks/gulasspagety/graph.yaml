start: s1

premise: >
  Restaurace na palubě rakety na cestě na Měsíc: matné sklo, chrom, neonové trubice barvy staré mědi. Olin u guláše
  s knedlíkem a piva, Jana u špaget a bílého vína. Oba se usmívají, ani jeden nemá chuť se hádat. A přesto…

characters: [olin_50, jana_50, robot]

locations:
