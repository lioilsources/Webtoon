# Gamebook — Archion: Dva světy. Verze „Le Chat“: hra o pěti dějstvích s intermezzem a epilogem, scénář napsal model
# Překlady (11 jazyků, 2026-11-14) jsou přímo ve storyboard.json (bubbles[].i18n, title_i18n): gamebook.py draft je přepíše, po změně scriptu přeložit znovu.
# Ol1n nosí brýle (od autora, 2026-11-14): thin-framed glasses ve všech jeho postavách.
# Kreslený věk (L40S test 1: vycházeli na 45–50): photo říká věk, jak vypadají (Ol1n 36, Kosmo 34, dřívější éry níž), bez „mature male“. Skutečný věk je Ol1n 46, Kosmo 44.
# Le Chat (od Ol1na). Páteř je obálka s penězi na release, který se nikdy nekonal. Lineární, sedm uzlů l1–l7.
# Smyšlená verze: druhá strana je smyšlená postava Kosmo a jeho hra Nebulon (Dreamer/Lukáš → Kosmo, Orbitron/Orbi →
# Nebulon, OrbitronTactics → NebulonTactics). Kosmovy repliky, které Le Chat přebral ze skutečného chatu, jsou
# přepsané vlastními slovy (smysl zůstal, nejsou to citace); repliky, které si Le Chat vymyslel (intermezzo,
# „Tři a půl kilobajtu…“, epilog), zůstaly. Ol1novy repliky jsou doslova, bez částek a dat: data v hlavičkách dějství
# vypuštěná (zůstala roční období), „furt mi visíš 30 000“ → „furt mi visíš peníze“, litanie dluhů bez částek a měsíců
# („Jednou. Podruhé. Potřetí.“), „Šedesát.“ v intermezzu vypuštěno, „90 tisíc“ → „peníze“, splátky „do Vánoc první
# část, v březnu další, v srpnu zbytek“, „těch 30 000“ → „ty peníze“, štítek krabice „ORBITRON 2006–2026 R.I.P.“ →
# „NEBULON — R.I.P.“. Emoji vypuštěné. Věta „O těch 60K, které jsi mi dal…“ je jako v archion a2 („O penězích na
# release Nebulonu…“), protože peníze dal Ol1n Kosmovi, ne naopak.
# Opravené překlepy: „Hoto“ → „Hotovo“, „stalo“ → „stálo“ (v přepsané Kosmově replice), „Teď si to“ → „Teď sis to“,
# „si ho zpeněžil“ → „sis ho zpeněžil“, „Nikdy jsi mi nenechal“ → „Nikdy jsi mě nenechal“, „vydal i napůl s tebou“ →
# „vydal napůl se mnou“, „fakána“ → „fakana“ (jako v archion a4).
# Intermezzo Le Chat uvádí „před rokem“, ale odpočet běží roky (12, 24, 60, 120 měsíců) a hraje ho „dva mladší muži“:
# titulek je proto „Kdysi. Jaro.“. Kosmo a Ol1n ani v intermezzu nejsou v jednom obraze, každý má svůj panel.
# Postavy podle autora (2026-11-14): Ol1n 46, vypadá pod čtyřicet, krátké blond vlasy, plnovous; Kosmo 44, vypadá pod
# čtyřicet, rozcuchané blond vlasy trčící do stran, strniště, ošoupaný vlněný svetr, na vzhledu mu nezáleží.
# V intermezzu oba mladší (vypadají na třicet), Kosmo sebevědomý, s ankhem na krku. Ve sklepě jeho zájmy jako rekvizity:
# tarot, egyptský papyrus a ankh, figurka mimozemšťana, knihy o archeologii, plakát pyramidy.
#
# Styl: archion_ligne — akvarelová bande dessinée na Hassaku (watercolor, ink outlines, european comics): Le Chat je od
# Mistralu, francouzský. Původně ligne claire, ta podle testů L40S nedržela: na Illustrious i s moebius/western comics
# vycházelo anime (Kosmo jako dívka), na Juggernautu fotka; art deco plakát kreslil nečitelný text (2026-11-14).
# Prostředí: kryt je klenutý kamenný sklep pod městem s regály grafických karet a modrofialovými neony; zahrada je
# francouzská zelinářská zahrádka (potager) se zinkovým stolkem. Intermezzo v teplém oranžovém světle, odpočet
# „NEBULON – COMING SOON“ v titulcích, obálka se rozpadne na prach. Epilog: prázdná roztržená obálka na čáře mezi
# oběma polovinami. Rekvizity: karty padají jako listí, kytička v květináči u notebooku, karty v krabicích.
# Hudba (L40S, ACE-Step, rules/base/music.yaml `gamebooks:` na větvi fix/gamebook-music):
#   archion_lechat: "french musette waltz, melancholic accordion, slow, nylon guitar, rainy paris evening"

schema: 1
id: archion_lechat
title: "Archion: Dva světy"
title_i18n: {en: "Archion: Two Worlds", de: "Archion: Zwei Welten", fr: "Archion : deux mondes", it: "Archion: due mondi", ja: "アルキオン：ふたつの世界", ko: "아르키온: 두 개의 세계", pl: "Archion: Dwa światy", pt-BR: "Archion: Dois mundos", ru: "Архион: Два мира", uk: "Архіон: Два світи", vi: "Archion: Hai thế giới"}
world: w_archion_lechat
audience: adult
language: cs
style_id: archion_ligne
profile: archion
product_id: gamebook_archion_lechat
start: l1

premise: >
  Pět ročních dob a jedna obálka s penězi. Kosmo deset let sní o hře Nebulon v klenutém sklepě pod městem, Ol1n píše
  kód na zahradě plné dětí. Kdysi stačilo jedno přikývnutí, „dobře, v titulcích“, a z něj vyrostl celý spor.

characters: [kosmo, kosmo_mlady, ol1n_mlady, ol1n_jaro, ol1n_leto, ol1n_podzim, ol1n_zima, dcera_9, dvojcata_5]

