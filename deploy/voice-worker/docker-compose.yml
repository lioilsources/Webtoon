# Toonfork voice worker on Spark (docs/voice-backend.md): webtoon-api voice queue on JODA →
# spark-broker lease of `tts` while there is work → AiStack audio (localhost:8093).
# Same pattern as Hajánek's forge worker: rootful Docker, host network for localhost:8093/:8100.
#
#   cp worker.env.example worker.env     # VOICE_WORKER_TOKEN from JODA's deploy/.env (see the doc)
#   docker compose up -d --build
#   docker logs -f toonfork-voice-worker
name: toonfork-voice

services:
  worker:
    build:
      context: ../../backend
      target: voice-worker
    image: toonfork-voice-worker:latest
    container_name: toonfork-voice-worker
    restart: unless-stopped
    env_file: worker.env
    environment:
      VOICE_WORK_DIR: /work
    network_mode: host
    # Line takes live only in memory, never on Spark's disk.
    tmpfs:
      - /work:uid=65532,gid=65532,mode=0700
