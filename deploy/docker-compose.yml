# Webtoon Studio backend (JODA): API only behind Caddy, exposed via Cloudflare Tunnel as
# https://webtoon-api.ol1n.com. No ports are published on the host. Run by deploy/deploy.sh.
# MODE=api: no workers here. Generating needs the Spark GPU, and that goes through the spark-broker from the Mac.
# The database here is the only one: the Mac connects to it over the LAN (backend/.env, DATABASE_URL).
name: webtoon

services:
  db:
    image: postgres:16
    container_name: webtoon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: webtoon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: webtoon
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The Mac (worker, CLI, integration tests) uses this database directly; no Postgres on the Mac.
    # DB_BIND in .env = JODA's LAN address; default keeps it on loopback.
    ports:
      - "${DB_BIND:-127.0.0.1}:5434:5432"
    networks: [webtoon]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoon -d webtoon"]
      interval: 5s
      timeout: 3s
      retries: 30

  webtoon:
    build:
      context: ../backend
    image: webtoon-api:latest
    container_name: webtoon-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /repo
    environment:
      DATABASE_URL: postgres://webtoon:${POSTGRES_PASSWORD}@db:5432/webtoon?sslmode=disable
      MEDIA_DIR: /media
      MEDIA_BASE_URL: /media
      MODE: api
      LISTEN_ADDR: ":8095"
      # Player voice (docs/voice-backend.md). The key and the worker token come from .env, made by
      # deploy.sh. Samples are encrypted files in ../voice-data, never in the repo or the database.
      VOICE_DATA_DIR: /voice-data
      VOICE_DATA_KEY: ${VOICE_DATA_KEY:-}
      VOICE_WORKER_TOKEN: ${VOICE_WORKER_TOKEN:-}
      VOICE_PUBLIC_URL: https://webtoon-api.ol1n.com
      VOICE_RECEIPT_MODE: ${VOICE_RECEIPT_MODE:-store}
      VOICE_APPLE_BUNDLE_ID: ${VOICE_APPLE_BUNDLE_ID:-com.ol1n.webtoon}
      VOICE_GOOGLE_PACKAGE: ${VOICE_GOOGLE_PACKAGE:-com.ol1n.webtoon}
      # Missing file = Play purchases fail closed (receipt_verification_unavailable).
      VOICE_GOOGLE_SERVICE_ACCOUNT_FILE: /secrets/play-service-account.json
      VOICE_RETENTION_DAYS: ${VOICE_RETENTION_DAYS:-180}
      VOICE_DAILY_LINES: ${VOICE_DAILY_LINES:-300}
    volumes:
      - ../media:/media
      - ../rules:/repo/rules:ro
      - ../data:/repo/data
      - ../voice-data:/voice-data
      - ../secrets:/secrets:ro
    networks: [webtoon]

  caddy:
    image: caddy:2-alpine
    container_name: webtoon-caddy
    restart: unless-stopped
    environment:
      STUDIO_TOKEN: ${STUDIO_TOKEN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [webtoon]

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: webtoon-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks: [webtoon]

volumes:
  pgdata:

networks:
  webtoon:
